services:
  eberli-hotel-mcp:
    image: ghcr.io/darkcheyenne/eberli-hotel-mcp:main
    build: .
    container_name: eberli-hotel-mcp
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      MCP_TRANSPORT: http
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      CHINA_TRAVEL_ENABLED: ${CHINA_TRAVEL_ENABLED:-true}
      TRIPADVISOR_TERRA_API_KEY: ${TRIPADVISOR_TERRA_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
